<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" fill="none">
  <defs>
    <linearGradient id="lounge-wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EEF2F6"/>
    </linearGradient>
    <linearGradient id="lounge-floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <linearGradient id="accent-teal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0F766E"/>
      <stop offset="100%" stop-color="#14B8A6"/>
    </linearGradient>
  </defs>

  <!-- Background Wall -->
  <rect width="800" height="290" fill="url(#lounge-wall)"/>
  <!-- Floor -->
  <rect y="290" width="800" height="160" fill="url(#lounge-floor)"/>

  <!-- Large Floor-to-Ceiling Windows -->
  <rect x="250" y="30" width="300" height="240" fill="#E0F2FE" stroke="#475569" stroke-width="4"/>
  <line x1="350" y1="30" x2="350" y2="270" stroke="#475569" stroke-width="3"/>
  <line x1="450" y1="30" x2="450" y2="270" stroke="#475569" stroke-width="3"/>
  <line x1="250" y1="120" x2="550" y2="120" stroke="#475569" stroke-width="3"/>

  <!-- Outside Campus Trees visible through glass -->
  <circle cx="300" cy="180" r="50" fill="#86EFAC" opacity="0.6"/>
  <circle cx="400" cy="170" r="60" fill="#6EE7B7" opacity="0.6"/>
  <circle cx="500" cy="190" r="45" fill="#A7F3D0" opacity="0.6"/>

  <!-- Study Pod / Large Table -->
  <rect x="200" y="240" width="400" height="20" rx="3" fill="#334155"/>
  <rect x="230" y="260" width="12" height="110" fill="#1E293B"/>
  <rect x="560" y="260" width="12" height="110" fill="#1E293B"/>
  <line x1="230" y1="310" x2="570" y2="310" stroke="#1E293B" stroke-width="4"/>

  <!-- Modern Pendant Lights Hanging -->
  <line x1="300" y1="0" x2="300" y2="140" stroke="#475569" stroke-width="2"/>
  <polygon points="280,160 320,160 310,140 290,140" fill="#0F766E"/>
  <circle cx="300" cy="162" r="6" fill="#FEF08A"/>

  <line x1="500" y1="0" x2="500" y2="140" stroke="#475569" stroke-width="2"/>
  <polygon points="480,160 520,160 510,140 490,140" fill="#0F766E"/>
  <circle cx="500" cy="162" r="6" fill="#FEF08A"/>

  <!-- Left: Wall-mounted Bookshelves -->
  <rect x="40" y="60" width="160" height="190" rx="4" fill="#1E293B"/>
  <line x1="40" y1="120" x2="200" y2="120" stroke="#475569" stroke-width="4"/>
  <line x1="40" y1="180" x2="200" y2="180" stroke="#475569" stroke-width="4"/>
  <!-- Bookshelf items -->
  <rect x="55" y="80" width="14" height="38" fill="#38BDF8"/>
  <rect x="71" y="85" width="16" height="33" fill="#F43F5E"/>
  <rect x="90" y="75" width="22" height="43" fill="#FBBF24"/>
  <rect x="115" y="82" width="18" height="36" fill="#34D399"/>
  <rect x="55" y="140" width="20" height="38" fill="#A855F7"/>
  <rect x="78" y="145" width="16" height="33" fill="#FB923C"/>
  <rect x="97" y="138" width="25" height="40" fill="#2DD4BF"/>

  <!-- Right: Indoor Plant -->
  <rect x="680" y="280" width="40" height="50" rx="4" fill="#B45309"/>
  <!-- Foliage -->
  <circle cx="700" cy="250" r="35" fill="#047857"/>
  <circle cx="680" cy="230" r="28" fill="#059669"/>
  <circle cx="720" cy="235" r="25" fill="#10B981"/>

  <!-- Study Chairs Around Table -->
  <rect x="260" y="220" width="45" height="40" rx="5" fill="url(#accent-teal)"/>
  <line x1="282" y1="260" x2="282" y2="330" stroke="#475569" stroke-width="4"/>

  <rect x="495" y="220" width="45" height="40" rx="5" fill="url(#accent-teal)"/>
  <line x1="517" y1="260" x2="517" y2="330" stroke="#475569" stroke-width="4"/>

  <!-- Laptops on Study Table -->
  <polygon points="360,238 410,238 405,248 365,248" fill="#CBD5E1"/>
  <rect x="365" y="220" width="40" height="20" rx="2" fill="#475569"/>
  <rect x="368" y="222" width="34" height="16" rx="1" fill="#BAE6FD"/>
</svg>
