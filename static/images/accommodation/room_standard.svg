<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" fill="none">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <linearGradient id="mattress" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0F766E"/>
      <stop offset="100%" stop-color="#14B8A6"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
  </defs>

  <!-- Wall Background -->
  <rect width="800" height="280" fill="url(#wall)"/>
  <!-- Floor (Oak / Laminate Tone) -->
  <rect y="280" width="800" height="170" fill="url(#floor)"/>
  <!-- Floor Board Lines -->
  <line x1="0" y1="330" x2="800" y2="330" stroke="#94A3B8" stroke-width="1" stroke-dasharray="40 10"/>
  <line x1="0" y1="380" x2="800" y2="380" stroke="#94A3B8" stroke-width="1" stroke-dasharray="30 20"/>
  <line x1="0" y1="280" x2="800" y2="280" stroke="#94A3B8" stroke-width="2"/>

  <!-- Window with Daylight -->
  <rect x="280" y="40" width="240" height="180" fill="#BAE6FD" stroke="#475569" stroke-width="6"/>
  <!-- Window Panes -->
  <line x1="400" y1="40" x2="400" y2="220" stroke="#475569" stroke-width="4"/>
  <line x1="280" y1="130" x2="520" y2="130" stroke="#475569" stroke-width="4"/>
  <!-- Sun/Sky inside window -->
  <circle cx="340" cy="90" r="25" fill="#FDE047" opacity="0.8"/>
  <path d="M 280 180 Q 340 150 400 180 Q 460 160 520 180 L 520 220 L 280 220 Z" fill="#34D399" opacity="0.6"/>

  <!-- Left: Study Desk & Bookshelf -->
  <!-- Bookshelf -->
  <rect x="50" y="50" width="160" height="110" fill="#78350F" rx="3"/>
  <line x1="50" y1="105" x2="210" y2="105" stroke="#9A3412" stroke-width="4"/>
  <!-- Books -->
  <rect x="65" y="65" width="18" height="40" fill="#3B82F6"/>
  <rect x="85" y="60" width="14" height="45" fill="#EF4444"/>
  <rect x="101" y="70" width="22" height="35" fill="#10B981"/>
  <rect x="125" y="62" width="16" height="43" fill="#F59E0B"/>
  <rect x="65" y="115" width="20" height="40" fill="#6366F1"/>
  <rect x="87" y="120" width="25" height="35" fill="#0D9488"/>

  <!-- Study Desk -->
  <rect x="40" y="210" width="200" height="15" fill="url(#wood)" rx="2"/>
  <!-- Desk Legs -->
  <rect x="50" y="225" width="10" height="110" fill="#1E293B"/>
  <rect x="220" y="225" width="10" height="110" fill="#1E293B"/>
  <!-- Laptop on Desk -->
  <rect x="90" y="180" width="60" height="40" rx="3" fill="#334155"/>
  <rect x="95" y="185" width="50" height="30" fill="#93C5FD"/>
  <polygon points="80,210 160,210 150,220 90,220" fill="#64748B"/>
  <!-- Desk Lamp -->
  <path d="M 190 210 L 190 170 L 175 160" stroke="#0F766E" stroke-width="4" fill="none"/>
  <polygon points="165,155 185,155 190,170 160,170" fill="#0F766E"/>

  <!-- Ergonomic Desk Chair -->
  <rect x="100" y="235" width="50" height="45" rx="6" fill="#1E293B"/>
  <rect x="105" y="280" width="40" height="10" fill="#334155"/>
  <line x1="125" y1="290" x2="125" y2="340" stroke="#475569" stroke-width="6"/>
  <circle cx="125" cy="345" r="8" fill="#1E293B"/>

  <!-- Right: Student Single Bed -->
  <!-- Bed Headboard -->
  <rect x="580" y="160" width="180" height="110" rx="6" fill="#1E293B"/>
  <!-- Bed Frame -->
  <rect x="560" y="260" width="210" height="40" rx="4" fill="#334155"/>
  <!-- Mattress / Quilt -->
  <rect x="555" y="240" width="205" height="35" rx="6" fill="url(#mattress)"/>
  <!-- Cozy Folded Duvet Accent -->
  <rect x="555" y="255" width="130" height="20" rx="4" fill="#115E59"/>
  <!-- Fluffy Pillow -->
  <rect x="680" y="225" width="65" height="30" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>

  <!-- Bed Legs -->
  <rect x="570" y="300" width="12" height="45" fill="#0F172A"/>
  <rect x="740" y="300" width="12" height="45" fill="#0F172A"/>

  <!-- Bedside Rug -->
  <ellipse cx="640" cy="360" rx="90" ry="25" fill="#CCFBF1" stroke="#99F6E4" stroke-width="2"/>
</svg>
