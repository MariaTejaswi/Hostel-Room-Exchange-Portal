<div class="card p-8 sm:p-10 text-center flex flex-col items-center justify-center bg-white border border-slate-200 rounded-xl">
    <div class="w-12 h-12 rounded-xl bg-slate-100 text-slate-400 flex items-center justify-center mb-3">
        {% if icon %}
            {{ icon|safe }}
        {% else %}
            <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"/>
            </svg>
        {% endif %}
    </div>
    <h3 class="text-sm font-bold text-slate-900 tracking-tight">{{ title|default:"No records found" }}</h3>
    <p class="mt-1 text-xs text-slate-500 max-w-sm leading-relaxed">{{ description|default:"There is currently no data matching the requested criteria." }}</p>
    {% if action_url and action_label %}
    <div class="mt-5">
        <a href="{{ action_url }}" class="btn-primary btn-sm flex items-center gap-1.5 shadow-2xs">
            <span>{{ action_label }}</span>
            <span>&rarr;</span>
        </a>
    </div>
    {% endif %}
</div>
