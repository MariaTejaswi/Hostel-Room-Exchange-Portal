<div class="stats-card-compact bg-white border border-slate-200 rounded-xl p-4 transition-all">
    <!-- Header: Title + Optional Icon/Indicator -->
    <div class="flex items-center justify-between gap-2">
        <span class="text-[11px] font-semibold uppercase tracking-wider text-slate-500 truncate" title="{{ title }}">{{ title }}</span>
        {% if icon %}
        <div class="w-6 h-6 rounded bg-slate-100 text-slate-600 flex items-center justify-center flex-shrink-0">
            {{ icon|safe }}
        </div>
        {% else %}
        <span class="w-2 h-2 rounded-full bg-teal-600/70"></span>
        {% endif %}
    </div>

    <!-- Main Value + Subtitle Row -->
    <div class="mt-2 flex flex-wrap items-baseline justify-between gap-x-2 gap-y-1">
        <span class="text-2xl font-bold text-slate-900 tracking-tight leading-none">{{ value }}</span>
        {% if subtitle %}
        <span class="text-[11px] text-slate-500 font-medium truncate" title="{{ subtitle }}">{{ subtitle }}</span>
        {% endif %}
    </div>

    <!-- Optional Progress Bar -->
    {% if progress_pct is not None %}
    <div class="mt-3">
        <div class="w-full bg-slate-100 rounded-full h-1.5 overflow-hidden">
            <div class="bg-teal-700 h-1.5 rounded-full transition-all" style="width: {{ progress_pct }}%;"></div>
        </div>
        <div class="mt-1 flex justify-between items-center text-[10px] text-slate-400 font-medium">
            <span>Occupancy</span>
            <span class="font-semibold text-slate-700 font-mono">{{ progress_pct }}%</span>
        </div>
    </div>
    {% endif %}
</div>
