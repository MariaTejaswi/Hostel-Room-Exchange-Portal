<div class="stats-card-compact bg-white border border-[#E8DED4] rounded-xl p-5 sm:p-6 transition-all shadow-2xs hover:border-[#C69B62]/50 hover:shadow-sm">
    <!-- Header: Title + Optional Icon/Indicator -->
    <div class="flex items-center justify-between gap-2">
        <span class="text-[11px] font-bold uppercase tracking-wider text-[#8A7B72] truncate" title="{{ title }}">{{ title }}</span>
        {% if icon %}
        <div class="w-8 h-8 rounded-lg bg-[#FAF4EB] text-[#702C3B] border border-[#E8DED4] flex items-center justify-center flex-shrink-0">
            {{ icon|safe }}
        </div>
        {% else %}
        <span class="w-2 h-2 rounded-full bg-[#702C3B]"></span>
        {% endif %}
    </div>

    <!-- Main Value + Subtitle Row -->
    <div class="mt-2.5 flex flex-wrap items-baseline justify-between gap-x-2 gap-y-1">
        <span class="text-2xl sm:text-3xl font-extrabold text-[#35251F] tracking-tight leading-none">{{ value }}</span>
        {% if subtitle %}
        <span class="text-[11px] text-[#8A7B72] font-medium break-words" title="{{ subtitle }}">{{ subtitle }}</span>
        {% endif %}
    </div>

    <!-- Optional Progress Bar -->
    {% if progress_pct is not None %}
    <div class="mt-3">
        <div class="w-full bg-[#FAF4EB] rounded-full h-1.5 overflow-hidden border border-[#E8DED4]/60">
            <div class="bg-[#702C3B] h-1.5 w-[var(--progress-width)] rounded-full transition-all" style="--progress-width: {{ progress_pct }}%;"></div>
        </div>
        <div class="mt-1.5 flex justify-between items-center text-[10px] text-[#8A7B72] font-medium">
            <span>Occupancy</span>
            <span class="font-bold text-[#702C3B] font-mono">{{ progress_pct }}%</span>
        </div>
    </div>
    {% endif %}
</div>
