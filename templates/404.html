{% extends 'layouts/base.html' %}
{% load static %}

{% block title %}Page Not Found — RoomLoop{% endblock %}

{% block body %}
<main class="min-h-screen w-full flex items-center justify-center bg-[#F5EBDD] px-4 py-8">
    <section class="w-full max-w-lg bg-white border border-[#E8DED4] rounded-2xl p-6 sm:p-8 text-center shadow-sm" aria-labelledby="not-found-title">
        <div class="w-14 h-14 mx-auto rounded-2xl bg-[#FAF4EB] border border-[#E8DED4] text-[#702C3B] flex items-center justify-center">
            <svg class="w-7 h-7" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M12 9v4m0 4h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/>
            </svg>
        </div>
        <p class="mt-5 text-xs font-bold uppercase tracking-wider text-[#702C3B]">RoomLoop</p>
        <h1 id="not-found-title" class="mt-1 text-2xl sm:text-3xl font-bold text-[#49372F]">Page not found</h1>
        <p class="mt-2 text-sm text-[#8A7B72] leading-relaxed">
            The page you requested does not exist or may no longer be available.
        </p>
        <div class="mt-6 flex flex-col sm:flex-row gap-3 justify-center">
            <a href="{% url 'accounts:dashboard' %}" class="btn-primary justify-center">Return to Dashboard</a>
            <a href="{% url 'accounts:login' %}" class="btn-secondary justify-center">Sign In</a>
        </div>
    </section>
</main>
{% endblock %}
