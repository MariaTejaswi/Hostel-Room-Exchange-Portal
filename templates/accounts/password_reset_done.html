{% extends 'layouts/auth.html' %}

{% block title %}Reset Link Sent — RoomLoop Portal{% endblock %}

{% block auth_content %}
<div class="card p-8 shadow-md text-center">
    <div class="w-12 h-12 rounded-full bg-teal-50 text-teal-700 flex items-center justify-center mx-auto mb-4">
        <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
    </div>
    <h2 class="text-xl font-bold text-slate-900 tracking-tight">Check your email</h2>
    <p class="mt-2 text-xs text-slate-500 leading-relaxed">
        If an active account exists with the provided institutional email, password reset instructions have been dispatched.
    </p>

    <div class="mt-6">
        <a href="{% url 'accounts:login' %}" class="btn-primary w-full">
            Return to Sign In
        </a>
    </div>
</div>
{% endblock %}
