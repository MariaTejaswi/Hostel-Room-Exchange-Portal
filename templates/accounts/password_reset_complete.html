{% extends 'layouts/auth.html' %}

{% block title %}Password Changed — RoomLoop Portal{% endblock %}

{% block auth_content %}
<div class="card p-8 shadow-md text-center">
    <div class="w-12 h-12 rounded-full bg-emerald-50 text-emerald-700 flex items-center justify-center mx-auto mb-4">
        <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
    </div>
    <h2 class="text-xl font-bold text-slate-900 tracking-tight">Password reset successful</h2>
    <p class="mt-2 text-xs text-slate-500 leading-relaxed">
        Your password has been successfully updated. You may now log in with your new credentials.
    </p>

    <div class="mt-6">
        <a href="{% url 'accounts:login' %}" class="btn-primary w-full">
            Sign In Now
        </a>
    </div>
</div>
{% endblock %}
